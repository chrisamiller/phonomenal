# Aquarium shop. Prices are in credits; change freely (the economy report on the
# progress page shows how fast credits are earned). `category` decides where an item
# lives: fish swim, coral/decor sit on the sand, tank items change the tank itself.

[tank]
capacity = 15         # items allowed in the tank
big_capacity = 30     # after buying the bigger tank

