# Achievements. Each fires once (per tier), shows a pop-up, and awards `credits`.
# `rule.counter` names a stat computed in app/achievements.py; `at_least` or `tiers` set the thresholds.
# Hidden achievements aren't shown on the trophy shelf until earned.

# --- Showing up ---
[[achievement]]
id = "first-splash"
name = "First Splash"
description = "Complete your first daily mission."
rule = { counter = "missions_completed", at_least = 1 }
credits = 10

[[achievement]]
id = "five-alive"
name = "Five Alive"
description = "Reach your weekly goal."
rule = { counter = "weekly_goals_met", tiers = [1, 4, 10, 25] }
credits = 26

[[achievement]]
id = "monthly-regular"
name = "Monthly Regular"
description = "Reach your weekly goal 4 weeks in a row."
rule = { counter = "goal_week_streak", at_least = 4 }
credits = 40

[[achievement]]
id = "perfect-week"
name = "Perfect Week"
description = "Complete a mission all 7 days of a week."
rule = { counter = "perfect_weeks", at_least = 1 }
credits = 40

[[achievement]]
id = "comeback-kid"
name = "Comeback Kid"
description = "Practise on your first day back after a break of a week or more."
rule = { counter = "comeback_missions", at_least = 1 }
credits = 16

[[achievement]]
id = "weekend-warrior"
name = "Weekend Warrior"
description = "Complete a mission on a Saturday or Sunday."
rule = { counter = "weekend_missions", at_least = 1 }
credits = 10

[[achievement]]
id = "early-bird"
name = "Early Bird"
description = "Complete a mission before 8 a.m."
rule = { counter = "early_missions", at_least = 1 }
credits = 10

[[achievement]]
id = "night-owl"
name = "Night Owl"
description = "Complete a mission after 7 p.m."
rule = { counter = "late_missions", at_least = 1 }
credits = 10

